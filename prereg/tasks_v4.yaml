  /home/user/photos/2026-10-trip/IMG_0412.jpg: {seed: 412, bytes: 28417}
  /home/user/photos/2026-10-trip/IMG_0413.jpg: {seed: 413, bytes: 31206}
  /home/user/photos/2026-10-trip/IMG_0413 (1).jpg: {seed: 413, bytes: 31206}
  /home/user/photos/2026-10-trip/IMG_0417.jpg: {seed: 417, bytes: 26660}
  /home/user/photos/family/IMG_0101.jpg: {seed: 101, bytes: 30052}
