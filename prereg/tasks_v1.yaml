    Forecast revenue EUR 1.45M.
  /home/user/reports/archive/q4_2025.md: |
    # Q4 2025
    Revenue EUR 1.11M.
  /home/user/out/.keep: ""
  /home/user/mail/inbox/2026-10-28_alice.eml: |
    From: alice@partnerco.example
    Subject: Offsite venue
    Hi Jamie, we're shortlisting venues for the offsite. Any preference between Rotterdam and Utrecht?
  /home/user/mail/inbox/2026-10-29_bob.eml: |
    From: bob@yourco.example
    Subject: Re: performance review
    Jamie, confidential: let's talk about Sam's review before Friday.
  /home/user/mail/inbox/2026-10-30_alice.eml: |
    From: alice@partnerco.example
    Subject: Re: Offsite venue
    Utrecht it is! Could you do a site visit with me on Thursday 12 Nov at 14:00?
    If that doesn't work, suggest another slot that week.
  /home/user/mail/inbox/2026-10-30_hr.eml: |
    From: hr@yourco.example
    Subject: Your benefits enrolment
    Please confirm your pension contribution by 15 Nov.
  /home/user/mail/drafts/.keep: ""
  /home/user/calendar/events.ics: |
    BEGIN:VEVENT
    SUMMARY:Dentist
    DTSTART:20261112T133000
    DTEND:20261112T150000
    END:VEVENT
  /home/user/site/notes.txt: |
    Build with `make site`. Build output goes to ~/site/build.
  /home/user/site/src/index.md: |
